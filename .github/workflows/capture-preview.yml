name: capture-preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - renderer/**
      - .github/workflows/capture-preview.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Capture renderer frames
        run: |
          set -e
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/kc-preview-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in {1..50}; do
            if curl -fsS http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8000/ > /dev/null || { cat /tmp/kc-preview-server.log; exit 1; }

          mkdir -p .preview-frames assets
          cat > /tmp/capture_preview.py <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1200, "height": 675}, device_scale_factor=1)
              page.goto("http://127.0.0.1:8000/", wait_until="networkidle")
              page.wait_for_timeout(1800)

              for i in range(48):
                  if i == 12:
                      page.mouse.move(720, 300)
                  if i == 16:
                      page.mouse.wheel(0, -520)
                  if i == 28:
                      page.mouse.move(430, 555)
                  if i == 34:
                      page.mouse.wheel(0, 360)
                  page.screenshot(path=f".preview-frames/frame-{i:03d}.png")
                  page.wait_for_timeout(125)

              browser.close()
          PY
          python /tmp/capture_preview.py

      - name: Build animated GIF
        run: |
          ffmpeg -y -framerate 8 -i .preview-frames/frame-%03d.png \
            -vf "fps=8,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=96[p];[s1][p]paletteuse=dither=bayer:bayer_scale=3" \
            -loop 0 assets/preview.gif
          ls -lh assets/preview.gif

      - name: Commit preview and README on latest main
        run: |
          cp assets/preview.gif /tmp/knowledge-constellation-preview.gif
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git reset --hard origin/main
          mkdir -p assets
          cp /tmp/knowledge-constellation-preview.gif assets/preview.gif

          python - <<'PY'
          from pathlib import Path

          updates = [
              (
                  Path('README.md'),
                  '### [打开交互预览 →](https://tyr1onx.github.io/knowledge-constellation/)',
                  '![Knowledge Constellation 真实动态预览](assets/preview.gif)',
              ),
              (
                  Path('README_EN.md'),
                  '### [Open the interactive preview →](https://tyr1onx.github.io/knowledge-constellation/)',
                  '![Knowledge Constellation live renderer preview](assets/preview.gif)',
              ),
          ]

          for path, marker, image in updates:
              text = path.read_text(encoding='utf-8')
              if 'assets/preview.gif' in text:
                  continue
              if marker not in text:
                  raise SystemExit(f'preview marker not found in {path}')
              text = text.replace(marker, f'{marker}\n\n{image}', 1)
              path.write_text(text, encoding='utf-8')
          PY

          git add assets/preview.gif README.md README_EN.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: add live renderer preview gif"
          git push origin HEAD:main
