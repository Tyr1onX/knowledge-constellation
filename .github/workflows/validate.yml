name: validate

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile harness/pipeline.py harness/validate.py harness/compose_scene.py harness/build_site.py harness/e2e.py
      - run: node --check renderer/physics.js
      - run: node --check renderer/star-renderer.js
      - run: node --check renderer/stellar-color.js
      - run: node --check renderer/overview-visibility.js
      - run: node --check renderer/identity-core-physics.js
      - run: node --check renderer/identity-core-renderer.js
      - run: node --check renderer/identity-presence.js
      - run: node --check renderer/project-anchor.js
      - run: node --check renderer/presentation.js
      - run: node --check renderer/background-field.js
      - run: node --check renderer/semantic-zoom.js
      - run: node --check renderer/runtime.js
      - run: node --check renderer/index.js
