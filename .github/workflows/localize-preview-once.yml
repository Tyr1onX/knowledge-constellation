name: localize-preview-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/localize-preview-once.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localize deployed preview UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<div class="brand"><b>KNOWLEDGE CONSTELLATION</b><span>renderer-backed live preview</span></div>': '<div class="brand"><b>KNOWLEDGE CONSTELLATION</b><span>基于真实渲染器的交互预览</span></div>',
              '<a class="repo" href="https://github.com/Tyr1onX/knowledge-constellation" target="_blank" rel="noreferrer">VIEW ON GITHUB ↗</a>': '<a class="repo" href="https://github.com/Tyr1onX/knowledge-constellation" target="_blank" rel="noreferrer">在 GitHub 查看 ↗</a>',
              '<section class="preview-lab" id="preview-lab" aria-label="Renderer preview controls">': '<section class="preview-lab" id="preview-lab" aria-label="视觉预览控制">',
              '<div class="preview-head"><b>RENDERER PREVIEW</b><button class="preview-reset" id="preview-reset" type="button">恢复默认</button></div>': '<div class="preview-head"><b>视觉预览</b><button class="preview-reset" id="preview-reset" type="button">恢复默认</button></div>',
              '  monogram:\'Monogram\',eclipse:\'Eclipse\',quiet_star:\'Quiet Star\',minimal_ring:\'Minimal Ring\',\n  black_hole:\'Black Hole\',pulsar:\'Pulsar\',binary_star:\'Binary Star\',protostar_nebula:\'Protostar Nebula\',': '  monogram:\'字母徽记\',eclipse:\'日食\',quiet_star:\'静谧恒星\',minimal_ring:\'极简光环\',\n  black_hole:\'黑洞\',pulsar:\'脉冲星\',binary_star:\'双星\',protostar_nebula:\'原恒星星云\',',
              "const BACKGROUND_LABELS={almost_empty:'Almost Empty',cold_filament:'Cold Filament',broken_cloud:'Broken Cloud'};": "const BACKGROUND_LABELS={almost_empty:'近乎空白',cold_filament:'冷色纤维',broken_cloud:'碎云'};",
              '这里展示的是当前 Renderer 已实现的视觉能力；切换只影响预览，不改变知识模型。': '这里展示的是当前渲染器已经实现的视觉能力；切换只影响预览，不改变知识模型。',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit localized preview
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "demo: localize preview controls for Chinese users"
          git push origin HEAD:main
