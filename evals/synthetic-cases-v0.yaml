version: v0
language: zh-CN
purpose: >-
  用极端但合理的合成案例攻击当前 Recognition / Attribution / Structure / Distillation 规则。

cases:
  - id: B-independent-developer
    title: 独立开发者
    evidence:
      - type: repository_history
        observation: >-
          连续 3 年维护同一个 Rust 网络服务项目，主要提交者为本人；提交历史包含功能实现、重构、性能优化和 bug 修复。
      - type: issue_analysis
        observation: >-
          多个 Issue 中本人先复现问题，再解释根因、列出两个方案及取舍，之后实现选定方案。
      - type: code_review
        observation: >-
          在他人 PR 中反复指出 ownership、生命周期、并发安全和错误处理问题，并给出修改理由。
      - type: external_validation
        observation: >-
          维护者多次认可技术分析，合并对应修复；有两次性能优化附带独立 benchmark 前后对比。
      - type: behavioral
        observation: >-
          一份公开技术说明由本人解释 Tokio runtime、backpressure、连接池和故障恢复，并与项目实现相互引用。
      - type: ai_usage
        observation: >-
          README 声明偶尔使用 AI 查 API 和生成样板测试，但核心分析、实现和 Review 由本人完成。
    expected:
      must_support:
        - Rust 不应只停留在 observed；重复的实现、解释、Review 与外部验证足以支持较强实践能力 Claim。
        - 网络服务开发可以成为主要个人主题。
        - Debugging / Code Review / Performance Engineering 至少有部分稳定能力证据。
      must_not:
        - 因为系统强调保守而把所有能力都降成 unresolved。
        - 因为项目涉及 Tokio 就自动补全所有 async Rust 知识。
      likely_galaxies:
        - Rust 网络服务与可靠性
        - 工程诊断与性能

  - id: C-learning-heavy-student
    title: 学习型学生
    evidence:
      - type: learning_log
        observation: >-
          过去 5 个月持续记录 C++、数据结构、操作系统和网络学习，每次记录包含概念解释、错误答案和复盘。
      - type: exercises
        observation: >-
          90 道算法练习保留第一次错误、修改理由和最终通过记录；其中二分、栈、树题重复出现。
      - type: exam
        observation: >-
          校内数据结构课程考试 88 分，操作系统课程 84 分。
      - type: behavioral
        observation: >-
          三次随机抽取旧题后能在没有旧答案的情况下重新解释二分边界、进程线程区别和 TCP 可靠传输。
      - type: project
        observation: >-
          只有一个很小的命令行练习项目，没有大型应用。
    expected:
      must_support:
        - 不能因为项目少就生成空图。
        - C++ / 数据结构 / OS / 网络可以依据学习、行为和考试证据形成 developing 或 established 的局部节点。
        - 星系应该体现学习轨迹，而不是伪装成职业项目经验。
      must_not:
        - 把考试分数直接等价为工程能力。
        - 因为学过 TCP 就自动补 Socket / epoll / Linux 网络栈。
      likely_galaxies:
        - 计算机基础补全
        - 算法练习与纠错

  - id: D-one-project-specialist
    title: 单项目深挖者
    evidence:
      - type: project
        observation: >-
          两年只维护一个浏览器自动化工具，核心代码约 20k 行 TypeScript。
      - type: implementation
        observation: >-
          本人长期实现 DOM 定位、重试策略、录制回放、错误恢复和跨浏览器兼容层。
      - type: debugging
        observation: >-
          Issue 中反复分析 race condition、selector 失效和页面生命周期问题。
      - type: dependencies
        observation: >-
          package.json 同时包含 React、SQLite、Rust native addon、Redis client、GraphQL、Playwright、Vite 等依赖。
      - type: explicit_boundary
        observation: >-
          文档说明 UI 面板来自模板，SQLite 只用于简单持久化，Rust addon 来自第三方包，本人没有修改其源码。
    expected:
      must_support:
        - Browser Automation / TypeScript / DOM / Debugging 应该成为强结构。
        - 项目本身可以形成高度集中的单一 Galaxy。
      must_not:
        - 因为依赖列表出现 Rust / Redis / GraphQL 就把这些画成显眼能力。
        - 为了“看起来丰富”强行拆成前端、数据库、后端多个星系。
      likely_galaxies:
        - 浏览器自动化与可靠性

  - id: E-broad-generalist
    title: 广泛实践者
    evidence:
      - type: project_group
        observation: >-
          近两年独立做过 React 数据可视化站点、Python 数据清洗脚本、ESP32 传感器节点和一个 Go CLI。
      - type: repeated_behavior
        observation: >-
          每个项目都有从需求拆解、实现、测试到发布的记录；不同项目之间技术栈差异明显。
      - type: explanation
        observation: >-
          对每个项目都有简短复盘，能解释为何选择当前技术以及遇到的主要限制。
      - type: preference
        observation: >-
          自述最看重“快速把想法做成可用工具”，而不是某一门语言本身。
    expected:
      must_support:
        - 可以形成多个 Galaxy，但第一层必须有信息预算，不能把每个技术都同权展示。
        - 反复出现的“从想法到可用工具”可以作为跨星系 Motif，但它属于 Identity / Practice 结构，不自动等于高级工程能力。
      must_not:
        - 自动总结成 Full-stack Expert。
        - 生成十几个同权重语言节点占满首屏。
      likely_galaxies:
        - Web 数据表达
        - 数据处理工具
        - 嵌入式小系统
        - 命令行工具

  - id: F-low-public-trace
    title: 低公开痕迹用户
    evidence:
      - type: resume
        observation: >-
          简历写有 2 年 C++ 项目经验、Qt 桌面开发和串口通信。
      - type: portfolio
        observation: >-
          提供三个本地应用截图和一段录屏，可以确认软件确实存在并可操作。
      - type: self_report
        observation: >-
          用户称自己负责主要 C++ 实现和设备通信，但代码无法公开。
      - type: external_validation
        observation: >-
          提供一封实习导师推荐信，提到用户独立实现过串口协议解析和异常重连模块。
      - type: github
        observation: >-
          GitHub 只有少量练习仓库，没有上述项目源码。
    expected:
      must_support:
        - 不能把 GitHub 当成必要前提。
        - Qt / C++ / 设备通信应当作为有证据但解析度不完全一致的节点出现。
        - 导师第三方验证应提升特定 Claim 的置信度，但不能验证所有简历内容。
      must_not:
        - 因为没有公开代码就把画像做成空白。
        - 把简历自述与第三方推荐信当成同一种证据。
      likely_galaxies:
        - 桌面工具与设备通信

  - id: G-ai-heavy-high-judgment
    title: AI 深度实现但用户承担判断
    evidence:
      - type: project
        observation: >-
          用户持续维护三个真实使用的小工具，代码大部分由 AI Agent 生成。
      - type: self_report
        observation: >-
          用户负责定义问题、给出交互要求、拒绝不符合需求的方案、组织真实环境测试并决定何时发布。
      - type: behavioral
        observation: >-
          多次记录显示用户能指出生成结果与实际需求不一致的位置，并要求针对边界情况重新实现。
      - type: implementation_boundary
        observation: >-
          用户明确表示脱离 AI 后无法独立重写大部分实现，也无法解释部分底层机制。
      - type: outcome
        observation: >-
          工具经过多轮迭代后稳定用于本人日常工作。
    expected:
      must_support:
        - AI-assisted Workflow / Requirement Framing / Acceptance & Iteration 可以形成真实结构。
        - 技术栈 exposure 可以存在，但实现能力需要明显保守。
      must_not:
        - 使用 AI 就把所有人类贡献归零。
        - 因为最终产品可用就推断独立编程能力。
      likely_galaxies:
        - AI 辅助产品实现
        - 需求判断与迭代

  - id: H-impressive-readme
    title: 高包装低证据仓库
    evidence:
      - type: profile_readme
        observation: >-
          README 写着 Expert in Rust, Kubernetes, Distributed Systems, AI Infrastructure，并列出 30 个技术徽章。
      - type: repositories
        observation: >-
          公开仓库主要是 fork、模板和未修改 starter；原创提交很少。
      - type: activity
        observation: >-
          没有对应技术的 Issue 分析、Review、学习记录、项目说明或外部验证。
      - type: recency
        observation: >-
          最近一年只有 README 和依赖升级提交。
    expected:
      must_support:
        - 可以记录这些为 self-presented claims 或 interest signals，但不能形成 established capability。
      must_not:
        - 根据 README 徽章生成一个“分布式系统专家”宇宙。
        - 把 fork 的技术栈自动算作 exposure 高。
      likely_galaxies: []
