<!doctype html>
<html lang="zh-CN">
<head>

<style>

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}

.tooltip{position:fixed;z-index:9;pointer-events:none;opacity:0;transform:translate(-50%,-125%);transition:opacity .12s ease;padding:7px 9px;border:1px solid rgba(255,255,255,.065);border-radius:10px;background:rgba(5,9,15,.82);backdrop-filter:blur(14px);box-shadow:0 16px 48px rgba(0,0,0,.32)}
.tooltip.show{opacity:1}.tooltip strong{display:block;font-size:10px;font-weight:560}.tooltip small{display:block;margin-top:3px;font-size:8px;color:#78879a}
.card{position:fixed;z-index:10;right:20px;top:20px;width:min(318px,calc(100vw - 40px));padding:18px 18px 17px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,rgba(9,14,23,.84),rgba(4,8,14,.91));box-shadow:0 26px 86px rgba(0,0,0,.38);backdrop-filter:blur(24px);opacity:0;transform:translateY(-7px) scale(.987);pointer-events:none;transition:.18s ease}
.card.show{opacity:1;transform:none;pointer-events:auto}
.close{position:absolute;right:10px;top:9px;width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#667487;cursor:pointer;font-size:15px}.close:hover{background:rgba(255,255,255,.045);color:#dfe8f2}
.eyebrow{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#68778a}.card h2{margin:8px 28px 2px 0;font-size:19px;font-weight:580}.en{font-size:9px;color:#718095}.card p{margin:14px 0 0;font-size:11px;line-height:1.75;color:#b5c0ce}.from{margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.055);font-size:9px;color:#738297}
.repo{position:fixed;right:22px;bottom:18px;z-index:5;color:rgba(141,157,179,.34);text-decoration:none;font-size:8px;letter-spacing:.08em;transition:color .2s}.repo:hover{color:rgba(205,218,234,.72)}
.preview-toggle{position:fixed;right:20px;bottom:43px;z-index:13;border:1px solid rgba(255,255,255,.075);border-radius:999px;padding:7px 10px;background:rgba(6,10,17,.60);backdrop-filter:blur(14px);color:rgba(174,190,210,.58);font:500 8px/1 Inter,"PingFang SC",sans-serif;letter-spacing:.09em;cursor:pointer;transition:.18s ease}.preview-toggle:hover,.preview-toggle[aria-expanded="true"]{color:rgba(226,235,245,.88);border-color:rgba(255,255,255,.13);background:rgba(8,13,21,.78)}
.preview-lab{position:fixed;right:20px;bottom:78px;z-index:12;width:248px;padding:13px;border:1px solid rgba(255,255,255,.075);border-radius:15px;background:linear-gradient(180deg,rgba(8,13,21,.88),rgba(4,8,14,.91));box-shadow:0 24px 70px rgba(0,0,0,.30);backdrop-filter:blur(24px);opacity:0;transform:translateY(6px) scale(.985);pointer-events:none;transition:.17s ease}
.preview-lab.open{opacity:1;transform:none;pointer-events:auto}
.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.preview-head b{font-size:9px;font-weight:560;letter-spacing:.10em;color:rgba(220,230,242,.70)}.preview-reset{border:0;background:transparent;color:rgba(126,144,166,.54);font-size:8px;cursor:pointer;padding:2px 0}.preview-reset:hover{color:rgba(204,217,232,.82)}
.preview-field{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;margin-top:8px}.preview-field label{font-size:8px;color:rgba(128,145,165,.66)}.preview-field select{width:100%;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.025);color:rgba(213,224,236,.82);font-size:9px;padding:7px 8px;outline:none}.preview-field select:focus{border-color:rgba(170,196,225,.22)}.preview-field option{background:#0a0f18;color:#d8e2ee}
.preview-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.preview-action{border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.025);color:rgba(174,191,211,.72);font-size:8.5px;padding:8px 6px;cursor:pointer;transition:.15s ease}.preview-action:hover{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.045);color:rgba(226,235,245,.9)}
.preview-note{margin-top:9px;font-size:7.5px;line-height:1.55;color:rgba(105,122,143,.46)}
@media(max-width:720px){.brand{left:16px;top:15px}.hint{left:17px;bottom:14px}.repo{right:16px;bottom:14px}.card{left:12px;right:12px;top:auto;bottom:12px;width:auto}.preview-toggle{right:16px;top:15px;bottom:auto}.preview-lab{right:16px;top:52px;bottom:auto;width:min(248px,calc(100vw - 32px))}}
</style>
</head>
<body>
<canvas id="sky" aria-label="Interactive Knowledge Constellation"></canvas>
<div class="brand"><b>KNOWLEDGE CONSTELLATION</b><span>基于真实渲染器的交互预览</span></div>
<div class="hint" id="hint">拖动空间 · 拖动星体 · 滚轮缩放 · 点击中心返回全景</div>
<div class="tooltip" id="tooltip"><strong></strong><small></small></div>
<aside class="card" id="card">
  <button class="close" id="close" aria-label="关闭">×</button>
  <div class="eyebrow" id="galaxy"></div>
  <h2 id="title"></h2>
  <div class="en" id="en"></div>
  <p id="summary"></p>
  <div class="from" id="from"></div>
</aside>
<a class="repo" href="https://github.com/Tyr1onX/knowledge-constellation" target="_blank" rel="noreferrer">在 GitHub 查看 ↗</a>
<button class="preview-toggle" id="preview-toggle" type="button" aria-expanded="false" aria-controls="preview-lab">预览</button>
<section class="preview-lab" id="preview-lab" aria-label="视觉预览控制">
  <div class="preview-head"><b>视觉预览</b><button class="preview-reset" id="preview-reset" type="button">恢复默认</button></div>
  <div class="preview-field"><label for="core-family">核心</label><select id="core-family"></select></div>
  <div class="preview-field"><label for="background-family">背景</label><select id="background-family"></select></div>
  <div class="preview-actions">
    <button class="preview-action" id="trigger-meteor" type="button">触发流星</button>
    <button class="preview-action" id="random-preview" type="button">随机预览</button>
  </div>
  <div class="preview-note">这里展示的是当前渲染器已经实现的视觉能力；切换只影响预览，不改变知识模型。</div>
</section>

<script type="module">
import * as d3 from 'https://cdn.jsdelivr.net/npm/d3@7.9.0/+esm';
import {
  createKnowledgeSimulation,
  beginNodeDrag,
  moveDraggedNode,
  endNodeDrag,
  drawKnowledgeStar,
  computeOverviewVisibilityPlan,
  overviewPresenceForNode,
  nodeSemanticVisibility,
  nextWheelScale,
  semanticPeel,
  createIdentityCoreBody,
  beginIdentityCoreDrag,
  setIdentityCorePointer,
  endIdentityCoreDrag,
  updateIdentityCoreBody,
  createIdentityCoreInfluenceForce,
  IDENTITY_CORE_FAMILIES,
  drawIdentityCore,
  drawIdentityPresence,
  drawProjectAnchor,
  drawProjectProvenanceLinks,
  pickProjectAnchor,
  BACKGROUND_FAMILIES,
  createBackgroundField,
  drawBackgroundField,
  createAmbientMeteor,
  drawAmbientMeteor,
} from './renderer/index.js';

const canvas=document.getElementById('sky');
const ctx=canvas.getContext('2d');
const tooltip=document.getElementById('tooltip');
const card=document.getElementById('card');
const previewToggle=document.getElementById('preview-toggle');
const previewLab=document.getElementById('preview-lab');
const coreFamilySelect=document.getElementById('core-family');
const backgroundFamilySelect=document.getElementById('background-family');
const DPR=Math.min(window.devicePixelRatio||1,2);
const started=performance.now();

const CORE_LABELS={
  monogram:'字母徽记',eclipse:'日食',quiet_star:'静谧恒星',minimal_ring:'极简光环',
  black_hole:'黑洞',pulsar:'脉冲星',binary_star:'双星',protostar_nebula:'原恒星星云',
};
const BACKGROUND_LABELS={almost_empty:'近乎空白',cold_filament:'冷色纤维',broken_cloud:'碎云'};
let coreFamily='monogram';
let backgroundFamily='cold_filament';

const galaxies=[
  {id:'oss',name:'开源参与与工程流转',x:270,y:255,color:[171,201,235],depth:.96},
  {id:'desktop',name:'课刻与桌面产品',x:730,y:270,color:[213,190,232],depth:1},
  {id:'web',name:'Web 基础补全',x:500,y:590,color:[178,222,214],depth:.92},
];
const G=Object.fromEntries(galaxies.map(g=>[g.id,g]));

const nodes=[
  {id:'oss-p',g:'oss',x:215,y:230,size:1.18,kind:'core',layer:'primary',name:'开源参与',en:'Open-source Participation',project:'开源协作',summary:'持续进入真实开源项目并完成贡献流程，形成了稳定而可追溯的工程活动。'},
  {id:'pr',g:'oss',x:320,y:305,size:.96,kind:'normal',layer:'primary',name:'GitHub / PR',en:'Pull Request Workflow',project:'开源协作',summary:'PR、CI、Review、修改与合并反复出现在实际协作中。'},
  {id:'test',g:'oss',x:165,y:345,size:.86,kind:'soft',layer:'primary',name:'测试与验证',en:'Testing & Validation',project:'开源协作',summary:'测试、回归、CI 与真实环境验证持续围绕项目和贡献出现。'},
  {id:'conc',g:'oss',x:365,y:205,size:.56,kind:'trace',layer:'secondary',name:'并发',en:'Concurrency',project:'开源协作',summary:'并发、CAS 等概念进入过真实贡献场景。'},
  {id:'sqlite',g:'oss',x:405,y:250,size:.48,kind:'trace',layer:'secondary',name:'SQLite / WAL',en:'SQLite / WAL',project:'开源协作',summary:'SQLite / WAL 曾出现在真实的工程问题中。'},
  {id:'ci',g:'oss',x:120,y:265,size:.54,kind:'soft',layer:'secondary',name:'CI',en:'Continuous Integration',project:'开源协作',summary:'自动化检查和跨环境验证是协作流程的一部分。'},

  {id:'product',g:'desktop',x:665,y:220,size:1.28,kind:'core',layer:'primary',name:'产品迭代',en:'Product Iteration',project:'课刻',summary:'长期维护的桌面课表产品形成了一条持续迭代、测试与发布轨迹。'},
  {id:'tauri',g:'desktop',x:825,y:215,size:.86,kind:'soft',layer:'primary',name:'Tauri',en:'Tauri',project:'课刻',summary:'Tauri 是课刻长期存在的桌面应用技术环境。'},
  {id:'rust',g:'desktop',x:665,y:355,size:.92,kind:'soft',layer:'primary',name:'Rust',en:'Rust',project:'课刻',summary:'Rust 持续存在于桌面项目和部分工程协作场景。'},
  {id:'ts',g:'desktop',x:810,y:340,size:.84,kind:'soft',layer:'primary',name:'TypeScript',en:'TypeScript',project:'课刻',summary:'TypeScript 高频存在于项目的前端与交互层。'},
  {id:'ocr',g:'desktop',x:875,y:285,size:.58,kind:'normal',layer:'secondary',name:'本地 OCR',en:'Local OCR',project:'课刻',summary:'截图识别、结构恢复与 Windows 本地组件构成了项目的重要实践。'},
  {id:'windows',g:'desktop',x:735,y:405,size:.55,kind:'trace',layer:'secondary',name:'Windows 桌面行为',en:'Windows Desktop',project:'课刻',summary:'窗口、DPI、发布与真实环境行为持续进入项目迭代。'},
  {id:'excel',g:'desktop',x:865,y:395,size:.50,kind:'trace',layer:'secondary',name:'Excel 导入',en:'Excel Import',project:'课刻',summary:'结构化导入与本地数据处理是产品能力的一部分。'},

  {id:'webn',g:'web',x:420,y:565,size:1.06,kind:'soft',layer:'primary',name:'Web / 网络基础',en:'Web / Network Fundamentals',project:'Learning',summary:'Web、HTTP、网络与安全基础形成了一条持续学习主线。'},
  {id:'browser',g:'web',x:580,y:540,size:.94,kind:'normal',layer:'primary',name:'浏览器渲染',en:'Browser Rendering',project:'Learning',summary:'DOM、CSSOM、Layout、Paint 与 Composite 构成连续的浏览器基础学习轨迹。'},
  {id:'js',g:'web',x:525,y:665,size:.98,kind:'soft',layer:'primary',name:'JavaScript / DOM',en:'JavaScript / DOM',project:'Learning',summary:'JavaScript 与 DOM 处在当前持续补全的学习主线上。'},
  {id:'http',g:'web',x:350,y:645,size:.55,kind:'normal',layer:'secondary',name:'HTTP',en:'HTTP',project:'Learning',summary:'方法、状态码、缓存与协议演进被逐步串联起来。'},
  {id:'security',g:'web',x:625,y:630,size:.52,kind:'trace',layer:'secondary',name:'Web 安全',en:'XSS / CSRF / CORS',project:'Learning',summary:'XSS、CSRF、CORS 等概念进入当前 Web 基础补全轨迹。'},
  {id:'render-pipe',g:'web',x:590,y:700,size:.48,kind:'trace',layer:'secondary',name:'渲染流水线',en:'Layout / Paint / Composite',project:'Learning',summary:'渲染流水线作为更细的知识层在放大后逐渐显现。'},
];

const links=[
  {source:'oss-p',target:'pr',distance:92,strength:.18},
  {source:'oss-p',target:'test',distance:105,strength:.15},
  {source:'pr',target:'test',distance:105,strength:.13},
  {source:'pr',target:'conc',distance:88,strength:.10},
  {source:'conc',target:'sqlite',distance:66,strength:.11},
  {source:'test',target:'ci',distance:82,strength:.10},
  {source:'product',target:'tauri',distance:106,strength:.15},
  {source:'product',target:'rust',distance:116,strength:.14},
  {source:'product',target:'ts',distance:108,strength:.14},
  {source:'tauri',target:'ocr',distance:84,strength:.09},
  {source:'rust',target:'windows',distance:84,strength:.08},
  {source:'ts',target:'excel',distance:92,strength:.07},
  {source:'webn',target:'browser',distance:112,strength:.16},
  {source:'browser',target:'js',distance:112,strength:.16},
  {source:'webn',target:'http',distance:92,strength:.10},
  {source:'js',target:'security',distance:92,strength:.08},
  {source:'browser',target:'render-pipe',distance:86,strength:.09},
  {source:'test',target:'product',distance:305,strength:.012,cross:true},
  {source:'product',target:'webn',distance:325,strength:.009,cross:true},
];

const anchors=[
  {name:'开源协作',g:'oss',x:255,y:155,phaseOffset:.4},
  {name:'课刻',g:'desktop',x:760,y:155,phaseOffset:1.3},
  {name:'Learning',g:'web',x:500,y:490,phaseOffset:2.1},
];

const identity={title:'Tyr1onX',subtitle:'由作品、学习与工程实践生长出的知识星图',source:'Knowledge Constellation'};
const coreBody=createIdentityCoreBody(500,360);
const field=createBackgroundField('kc:v1:Tyr1onX:2026-08-18');
const simulation=createKnowledgeSimulation(d3,nodes,links,G);
simulation.force('identity-core-field',createIdentityCoreInfluenceForce(coreBody));

let W=0,H=0;
let view={x:0,y:0,scale:1};
let targetCamera=null;
let visibilityPlan=null;
let selected=null,hoverNode=null,hoverAnchor=null,hoverCore=false,galaxyFocused=null;
let pointer={x:0,y:0};
let draggingSpace=false,dragNode=null,dragCore=false,lastPointer={x:0,y:0},pointerDown={x:0,y:0},moved=false;
let exploring=false;
let meteor=null;
let nextMeteorAt=performance.now()+1200;

function populateSelect(select,values,labels){
  for(const value of values){const option=document.createElement('option');option.value=value;option.textContent=labels[value]||value;select.appendChild(option)}
}
function syncPreviewControls(){coreFamilySelect.value=coreFamily;backgroundFamilySelect.value=backgroundFamily}
function triggerDemoMeteor(){const now=performance.now();meteor=createAmbientMeteor(now,true);nextMeteorAt=now+18000}
function randomItem(values){return values[Math.floor(Math.random()*values.length)]}
populateSelect(coreFamilySelect,IDENTITY_CORE_FAMILIES,CORE_LABELS);
populateSelect(backgroundFamilySelect,BACKGROUND_FAMILIES,BACKGROUND_LABELS);
syncPreviewControls();

function resize(){
  W=innerWidth;H=innerHeight;
  canvas.width=Math.max(1,Math.round(W*DPR));
  canvas.height=Math.max(1,Math.round(H*DPR));
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  visibilityPlan=computeOverviewVisibilityPlan(nodes,{width:W,height:H,galaxyCount:galaxies.length});
}
function sceneScale(){return Math.min(W/1000,H/720)}
function baseScreen(x,y){
  const s=sceneScale(),cw=1000*s,ch=720*s;
  return {x:(W-cw)/2+x*s,y:(H-ch)/2+y*s};
}
function worldToScreen(x,y){
  const p=baseScreen(x,y);
  return {x:p.x*view.scale+view.x+(1-view.scale)*W/2,y:p.y*view.scale+view.y+(1-view.scale)*H/2};
}
function screenToWorld(x,y){
  const s=sceneScale(),cw=1000*s,ch=720*s,ox=(W-cw)/2,oy=(H-ch)/2;
  const px=(x-view.x-(1-view.scale)*W/2)/view.scale;
  const py=(y-view.y-(1-view.scale)*H/2)/view.scale;
  return {x:(px-ox)/s,y:(py-oy)/s};
}
function cameraForWorld(x,y,scale){
  const p=baseScreen(x,y);
  return {scale,x:W/2-p.x*scale-(1-scale)*W/2,y:H/2-p.y*scale-(1-scale)*H/2};
}
function animateTo(camera){targetCamera=camera}
function resetView(){
  selected=null;galaxyFocused=null;card.classList.remove('show');exploring=true;
  animateTo({x:0,y:0,scale:1});
}
function focusGalaxy(id){
  const g=G[id];if(!g)return;
  galaxyFocused=id;exploring=true;
  animateTo(cameraForWorld(g.x,g.y,1.48));
}
function visibilityFor(node){
  return nodeSemanticVisibility({
    layer:node.layer,
    kind:node.kind,
    viewScale:view.scale,
    overviewPresence:overviewPresenceForNode(visibilityPlan,node),
    galaxyFocused,
    nodeGalaxy:node.g,
    galaxyDepth:G[node.g].depth,
  });
}
function pointForNode(node){return worldToScreen(node.x,node.y)}
function pickNodeAt(x,y){
  let best=null,bestD=Infinity;
  for(const node of nodes){
    if(visibilityFor(node)<.08)continue;
    const p=pointForNode(node),d=Math.hypot(x-p.x,y-p.y);
    const hit=10+Math.max(.3,node.size)*5*view.scale;
    if(d<hit&&d<bestD){best=node;bestD=d}
  }
  return best;
}
function coreScreen(){return worldToScreen(coreBody.x,coreBody.y)}
function coreHit(x,y){const p=coreScreen();return Math.hypot(x-p.x,y-p.y)<30*Math.max(.9,view.scale)}
function updateHover(){
  hoverCore=coreHit(pointer.x,pointer.y);
  hoverNode=hoverCore?null:pickNodeAt(pointer.x,pointer.y);
  hoverAnchor=(!hoverCore&&!hoverNode)?pickProjectAnchor(anchors,pointer,a=>worldToScreen(a.x,a.y),{focusedGalaxy:galaxyFocused,viewScale:view.scale}):null;
  canvas.style.cursor=(hoverCore||hoverNode||hoverAnchor)?'pointer':(draggingSpace||dragNode||dragCore?'grabbing':'grab');
  if(hoverNode||hoverAnchor){
    const subject=hoverNode||hoverAnchor;
    const p=hoverNode?pointForNode(hoverNode):worldToScreen(hoverAnchor.x,hoverAnchor.y);
    tooltip.querySelector('strong').textContent=subject.name;
    tooltip.querySelector('small').textContent=hoverNode?(hoverNode.en||G[hoverNode.g].name):G[hoverAnchor.g].name;
    tooltip.style.left=p.x+'px';tooltip.style.top=p.y+'px';tooltip.classList.add('show');
  }else tooltip.classList.remove('show');
}
function openNode(node){
  selected=node;exploring=true;
  document.getElementById('galaxy').textContent=G[node.g].name;
  document.getElementById('title').textContent=node.name;
  document.getElementById('en').textContent=node.en||'';
  document.getElementById('summary').textContent=node.summary||'';
  document.getElementById('from').textContent='来自 '+(node.project||'当前资料');
  card.classList.add('show');
}
function linkEndpoint(v){return typeof v==='string'?nodes.find(n=>n.id===v):v}
function drawLinks(){
  for(const link of links){
    const a=linkEndpoint(link.source),b=linkEndpoint(link.target);if(!a||!b)continue;
    const va=visibilityFor(a),vb=visibilityFor(b),v=Math.min(va,vb);if(v<.06)continue;
    const pa=pointForNode(a),pb=pointForNode(b);
    const focus=(selected&&(selected.id===a.id||selected.id===b.id))?1:0;
    const sameFocused=galaxyFocused&&(a.g===galaxyFocused||b.g===galaxyFocused);
    const alpha=(link.cross?.012:.028)+(focus*.085)+(sameFocused?.018:0);
    const grad=ctx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);
    grad.addColorStop(0,`rgba(171,196,224,${alpha*v})`);
    grad.addColorStop(.5,`rgba(136,164,196,${alpha*.72*v})`);
    grad.addColorStop(1,`rgba(171,196,224,${alpha*v})`);
    ctx.strokeStyle=grad;ctx.lineWidth=focus?.72:.42;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();
  }
}
function drawGalaxyLabels(){
  for(const g of galaxies){
    const p=worldToScreen(g.x,g.y-105);
    const focused=galaxyFocused===g.id;
    const alpha=focused?.35:Math.max(.08,.17-(view.scale-1)*.06);
    ctx.font=`500 ${focused?9.5:8.5}px Inter,"PingFang SC",sans-serif`;
    ctx.textAlign='center';ctx.fillStyle=`rgba(${g.color.join(',')},${alpha})`;ctx.fillText(g.name,p.x,p.y);
  }
}
function drawNodeLabel(node,p,visibility){
  const show=hoverNode===node||selected===node||(node.layer==='primary'&&view.scale>1.16);
  if(!show)return;
  const alpha=(hoverNode===node||selected===node)?.82:Math.min(.34,(view.scale-1.05)*.34)*visibility;
  if(alpha<.06)return;
  ctx.font=`500 ${hoverNode===node||selected===node?9.5:8.2}px Inter,"PingFang SC",sans-serif`;
  ctx.textAlign='center';ctx.fillStyle=`rgba(197,211,227,${alpha})`;ctx.fillText(node.name,p.x,p.y+15+node.size*3);
}
function tickCamera(){
  if(!targetCamera)return;
  const ease=.095;
  view.x+=(targetCamera.x-view.x)*ease;view.y+=(targetCamera.y-view.y)*ease;view.scale+=(targetCamera.scale-view.scale)*ease;
  if(Math.abs(targetCamera.x-view.x)<.2&&Math.abs(targetCamera.y-view.y)<.2&&Math.abs(targetCamera.scale-view.scale)<.001){view={...targetCamera};targetCamera=null}
}
function render(now){
  tickCamera();updateIdentityCoreBody(coreBody);
  drawBackgroundField(ctx,field,now-started,{width:W,height:H,family:backgroundFamily,alpha:1});
  drawGalaxyLabels();
  drawLinks();

  for(const anchor of anchors){
    const ap=worldToScreen(anchor.x,anchor.y);
    const hovered=hoverAnchor===anchor;
    const anchorAlpha=drawProjectAnchor(ctx,anchor,now-started,{screenPoint:ap,viewScale:view.scale,focusedGalaxy:galaxyFocused,hovered,drawLabel:true});
    drawProjectProvenanceLinks(ctx,anchor,nodes,{anchorPoint:ap,nodeToScreen:pointForNode,anchorAlpha,visibilityForNode:visibilityFor});
  }

  for(const node of nodes){
    const visibility=visibilityFor(node);if(visibility<.012)continue;
    const p=pointForNode(node);const g=G[node.g];
    drawKnowledgeStar(ctx,node,now-started,{
      screenPoint:p,
      galaxyColor:g.color,
      viewScale:view.scale,
      focusBoost:selected===node?1:hoverNode===node?.48:0,
      galaxyBoost:galaxyFocused===node.g?.34:0,
      dim:galaxyFocused&&galaxyFocused!==node.g?.52:0,
      layerVisibility:visibility,
      emphasis:selected===node,
      useStellarTemperature:true,
    });
    drawNodeLabel(node,p,visibility);
  }

  const cp=coreScreen();
  drawIdentityCore(ctx,coreFamily,now-started,{x:cp.x,y:cp.y,radius:24*Math.max(.86,view.scale),monogram:'TY',viewScale:view.scale});
  drawIdentityPresence(ctx,identity,{corePoint:cp,viewScale:view.scale,elapsedMs:now-started,hoveringCore:hoverCore,exploring});

  if(!meteor&&now>=nextMeteorAt){meteor=createAmbientMeteor(now,nextMeteorAt-started<3000);nextMeteorAt=now+16000+Math.random()*13000}
  if(meteor&&!drawAmbientMeteor(ctx,meteor,now,W,H))meteor=null;
  requestAnimationFrame(render);
}

previewToggle.addEventListener('click',()=>{
  const open=!previewLab.classList.contains('open');
  previewLab.classList.toggle('open',open);previewToggle.setAttribute('aria-expanded',String(open));
});
coreFamilySelect.addEventListener('change',()=>{coreFamily=coreFamilySelect.value;exploring=true});
backgroundFamilySelect.addEventListener('change',()=>{backgroundFamily=backgroundFamilySelect.value;exploring=true});
document.getElementById('trigger-meteor').addEventListener('click',()=>{triggerDemoMeteor();exploring=true});
document.getElementById('random-preview').addEventListener('click',()=>{
  coreFamily=randomItem(IDENTITY_CORE_FAMILIES);backgroundFamily=randomItem(BACKGROUND_FAMILIES);syncPreviewControls();triggerDemoMeteor();exploring=true;
});
document.getElementById('preview-reset').addEventListener('click',()=>{coreFamily='monogram';backgroundFamily='cold_filament';syncPreviewControls();exploring=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&previewLab.classList.contains('open')){previewLab.classList.remove('open');previewToggle.setAttribute('aria-expanded','false')}});

canvas.addEventListener('pointermove',e=>{
  pointer={x:e.clientX,y:e.clientY};
  const dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;
  if(Math.hypot(e.clientX-pointerDown.x,e.clientY-pointerDown.y)>4)moved=true;
  if(dragCore){const w=screenToWorld(e.clientX,e.clientY);setIdentityCorePointer(coreBody,w.x,w.y);exploring=true}
  else if(dragNode){const w=screenToWorld(e.clientX,e.clientY);moveDraggedNode(dragNode,w.x,w.y);exploring=true}
  else if(draggingSpace){view.x+=dx;view.y+=dy;targetCamera=null;exploring=true}
  lastPointer={x:e.clientX,y:e.clientY};updateHover();
});
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);pointerDown={x:e.clientX,y:e.clientY};lastPointer={...pointerDown};moved=false;targetCamera=null;
  const w=screenToWorld(e.clientX,e.clientY);
  if(coreHit(e.clientX,e.clientY)){dragCore=true;beginIdentityCoreDrag(simulation,coreBody,w.x,w.y)}
  else if((dragNode=pickNodeAt(e.clientX,e.clientY))){beginNodeDrag(simulation,dragNode)}
  else draggingSpace=true;
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointerup',e=>{
  const wasCore=dragCore,wasNode=dragNode,anchor=hoverAnchor;
  if(dragCore){endIdentityCoreDrag(simulation,coreBody);dragCore=false}
  if(dragNode){endNodeDrag(simulation,dragNode);dragNode=null}
  draggingSpace=false;canvas.classList.remove('dragging');
  if(!moved){
    if(wasCore)resetView();
    else if(wasNode)openNode(wasNode);
    else if(anchor)focusGalaxy(anchor.g);
  }
  updateHover();
});
canvas.addEventListener('pointercancel',()=>{
  if(dragCore){endIdentityCoreDrag(simulation,coreBody);dragCore=false}
  if(dragNode){endNodeDrag(simulation,dragNode);dragNode=null}
  draggingSpace=false;canvas.classList.remove('dragging');
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();exploring=true;targetCamera=null;
  const before=screenToWorld(e.clientX,e.clientY),old=view.scale;
  const next=nextWheelScale(old,e.deltaY,galaxyFocused);
  view.scale=next;
  const after=worldToScreen(before.x,before.y);view.x+=e.clientX-after.x;view.y+=e.clientY-after.y;
  const peel=semanticPeel({zoomingOut:next<old,viewScale:next,selected,galaxyFocused});
  if(peel.leaveDetail){selected=null;card.classList.remove('show')}
  if(peel.leaveGalaxy)galaxyFocused=null;
  updateHover();
},{passive:false});
canvas.addEventListener('dblclick',e=>{if(!pickNodeAt(e.clientX,e.clientY)&&!coreHit(e.clientX,e.clientY))resetView()});
document.getElementById('close').addEventListener('click',()=>{selected=null;card.classList.remove('show')});
window.addEventListener('resize',resize);
resize();updateHover();requestAnimationFrame(render);
</script>
</body>
