<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Constellation</title>
<style>
:root{color-scheme:dark;--fg:#eef4fb;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.dragging{cursor:grabbing}
.identity{position:fixed;z-index:5;left:26px;top:22px;pointer-events:none;user-select:none}
.identity b{display:block;font-size:11px;font-weight:560;letter-spacing:.16em;color:rgba(236,242,250,.62)}
.identity span{display:block;margin-top:5px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(160,173,191,.25)}
.hint{position:fixed;left:27px;bottom:20px;z-index:4;font-size:9px;letter-spacing:.05em;color:rgba(150,163,181,.26);pointer-events:none;transition:opacity .35s}
.tooltip{position:fixed;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,-125%);transition:opacity .1s ease;padding:7px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(5,9,15,.86);backdrop-filter:blur(12px);box-shadow:0 14px 45px rgba(0,0,0,.28)}
.tooltip.show{opacity:1}.tooltip strong{font-size:11px;font-weight:570}.tooltip small{display:block;margin-top:3px;font-size:9px;color:#7a8798}
.card{position:fixed;z-index:9;right:22px;top:22px;width:min(330px,calc(100vw - 44px));padding:19px 19px 17px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(10,15,24,.86),rgba(6,10,16,.91));box-shadow:0 24px 80px rgba(0,0,0,.36);backdrop-filter:blur(24px);opacity:0;transform:translateY(-8px) scale(.985);pointer-events:none;transition:.2s ease}
.card.show{opacity:1;transform:none;pointer-events:auto}
.close{position:absolute;right:13px;top:10px;border:0;background:transparent;color:#647082;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px}.close:hover{background:rgba(255,255,255,.05);color:#dfe7f0}
.galaxy{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#697587}.card h2{margin:9px 0 3px;font-size:20px;font-weight:580}.en{font-size:10px;color:#6f7a8b}.state{display:inline-flex;margin-top:13px;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px 8px;font-size:10px;color:#9aa6b6;background:rgba(255,255,255,.025)}.card p{font-size:12px;line-height:1.8;color:#bcc6d3}.explain{display:none;margin-top:15px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}.explain.show{display:block}.card h3{margin:0 0 7px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6d798c}.explain p{font-size:11px;color:#8894a5;margin:0 0 11px}.toggle{border:0;background:transparent;color:#788496;font-size:10px;padding:0;margin-top:5px;cursor:pointer}.toggle:hover{color:#c9d2de}
@media(max-width:720px){.identity{left:17px;top:16px}.hint{left:18px;bottom:15px}.card{left:13px;right:13px;top:auto;bottom:13px;width:auto}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="identity"><b>KNOWLEDGE CONSTELLATION</b><span>qibai</span></div>
<div class="hint" id="hint">拖动空间 · 拖动星体 · 滚轮缩放</div>
<div class="tooltip" id="tooltip"><strong></strong><small></small></div>
<aside class="card" id="card">
<button class="close" id="close">×</button>
<div class="galaxy" id="galaxy"></div><h2 id="title"></h2><div class="en" id="en"></div><div class="state" id="state"></div><p id="summary"></p>
<button class="toggle" id="toggle">查看这颗星为什么是这样</button>
<div class="explain" id="explain"><h3>现在能确认</h3><p id="known"></p><h3>仍然模糊</h3><p id="unknown"></p></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');
const tooltip=document.getElementById('tooltip'),card=document.getElementById('card');
const DPR=Math.min(devicePixelRatio||1,2);

const galaxies=[
{id:'oss',name:'开源参与与工程流转',x:265,y:275,color:[102,145,203]},
{id:'desktop',name:'课刻与桌面产品',x:735,y:275,color:[155,116,180]},
{id:'web',name:'Web 基础补全',x:500,y:585,color:[86,150,141]}
];
const G=Object.fromEntries(galaxies.map(g=>[g.id,g]));

const nodes=[
{id:'oss-p',g:'oss',x:215,y:225,size:18,type:'core',name:'开源参与',en:'Open-source Participation',state:'清晰',res:.95,color:'#e4f1ff',summary:'持续进入真实开源项目并完成贡献流程，已经形成稳定痕迹。',known:'持续参与、外部接受与维护者反馈都能被确认。',unknown:'不同 PR 中具体由本人完成了多少分析、实现和测试，仍需额外信息。'},
{id:'pr',g:'oss',x:320,y:315,size:13,type:'bridge',name:'GitHub / PR',en:'GitHub / Pull Request Workflow',state:'清晰',res:.92,color:'#c9dffd',summary:'PR、CI、Review、修改与合并反复出现在实践中。',known:'完整 PR 流程是真实且重复出现的。',unknown:'复杂 Git 操作和独立处理能力还没有被充分证明。'},
{id:'test',g:'oss',x:145,y:345,size:11,type:'forming',name:'测试与验证',en:'Testing & Validation',state:'正在形成',res:.63,color:'#a9c9f0',summary:'测试、回归、CI 与真实环境验证持续围绕项目与贡献出现。',known:'它明确属于当前工程经历的一部分。',unknown:'测试方案是否主要由本人设计、能否独立判断覆盖与正确性，还没有看清。'},
{id:'conc',g:'oss',x:365,y:205,size:6,type:'trace',name:'并发',en:'Concurrency',state:'外围痕迹',res:.26,color:'#88a3c6',summary:'并发、CAS 等概念进入过真实贡献场景。',known:'这些概念确实出现过。',unknown:'不能据此判断本人掌握并发机制。'},
{id:'sqlite',g:'oss',x:405,y:245,size:5,type:'trace',name:'SQLite / WAL',en:'SQLite / WAL',state:'外围痕迹',res:.22,color:'#758daa',summary:'SQLite / WAL 曾进入真实贡献场景。',known:'存在真实上下文关联。',unknown:'个人理解与独立实践深度未知。'},
{id:'product',g:'desktop',x:665,y:220,size:19,type:'core',name:'产品迭代',en:'Product Iteration',state:'正在形成',res:.67,color:'#f0e3f6',summary:'长期维护的个人产品形成了一条持续迭代轨迹。',known:'功能演进、限制、测试和发布等持续推进是真实存在的。',unknown:'具体实现、设计与判断分别由谁完成，仍没有完全解析。'},
{id:'tauri',g:'desktop',x:835,y:215,size:11,type:'veiled',name:'Tauri',en:'Tauri',state:'高关联 · 低解析',res:.31,color:'#cab2db',summary:'Tauri 是核心项目长期存在的技术环境。',known:'它与长期项目稳定关联。',unknown:'独立使用 Tauri 的能力深度尚未确认。'},
{id:'rust',g:'desktop',x:655,y:355,size:14,type:'veiled',name:'Rust',en:'Rust',state:'高关联 · 低解析',res:.27,color:'#d8bce0',summary:'Rust 在项目技术环境与部分贡献场景中反复出现。',known:'Rust 确实属于当前经历。',unknown:'项目中存在 Rust，不等于能独立实现、调试或解释 Rust。'},
{id:'ts',g:'desktop',x:815,y:345,size:11,type:'veiled',name:'TypeScript',en:'TypeScript',state:'高关联 · 低解析',res:.30,color:'#c4a8d1',summary:'TypeScript 高频存在于项目环境中。',known:'它是长期项目中的真实技术环境。',unknown:'独立实现与理解深度尚未确认。'},
{id:'webn',g:'web',x:420,y:575,size:17,type:'forming',name:'Web / 网络基础',en:'Web / Network Fundamentals',state:'正在形成',res:.70,color:'#d8f0eb',summary:'Web、HTTP、网络和安全基础形成了一条持续学习主线。',known:'存在结构化学习与纠错痕迹。',unknown:'长期记忆和迁移能力还没有通过新的行为证据确认。'},
{id:'browser',g:'web',x:575,y:535,size:14,type:'forming',name:'浏览器渲染',en:'Browser Rendering',state:'正在形成',res:.66,color:'#b9ded7',summary:'浏览器渲染主干已经形成连续学习轨迹。',known:'DOM、CSSOM、Layout、Paint、Composite 等都有真实学习记录。',unknown:'脱离提示后的稳定解释能力仍需后续观察。'},
{id:'js',g:'web',x:520,y:660,size:15,type:'forming',name:'JavaScript / DOM',en:'JavaScript / DOM',state:'正在形成',res:.72,color:'#c7e5df',summary:'JavaScript 与 DOM 明确处在当前学习主线。',known:'“正在学习”本身是高置信事实。',unknown:'目前不能把它表示成成熟能力。'}
];

const links=[
{source:'oss-p',target:'pr',distance:92,strength:.18},
{source:'oss-p',target:'test',distance:104,strength:.14},
{source:'pr',target:'test',distance:102,strength:.14},
{source:'pr',target:'conc',distance:88,strength:.10},
{source:'conc',target:'sqlite',distance:62,strength:.12},
{source:'product',target:'tauri',distance:106,strength:.15},
{source:'product',target:'rust',distance:118,strength:.14},
{source:'product',target:'ts',distance:106,strength:.14},
{source:'tauri',target:'rust',distance:98,strength:.09},
{source:'webn',target:'browser',distance:112,strength:.16},
{source:'browser',target:'js',distance:112,strength:.16},
{source:'test',target:'product',distance:300,strength:.012,cross:true}
];

const simulation=d3.forceSimulation(nodes)
  .alpha(0.72)
  .alphaMin(0.001)
  .alphaDecay(0.024)
  .velocityDecay(0.24)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.distance).strength(d=>d.strength).iterations(2))
  .force('charge',d3.forceManyBody()
    .strength(d=>d.type==='core'?-150:d.type==='trace'?-55:-105)
    .distanceMin(28).distanceMax(330).theta(.85))
  .force('collide',d3.forceCollide()
    .radius(d=>14+d.size*1.25)
    .strength(.82).iterations(2))
  .force('x',d3.forceX(d=>G[d.g].x).strength(d=>d.type==='core'?.055:.032))
  .force('y',d3.forceY(d=>G[d.g].y).strength(d=>d.type==='core'?.055:.032));

let W=0,H=0,view={x:0,y:0,scale:1},mouse={x:0,y:0,nx:.5,ny:.5};
let bg=[],clouds=[],hover=null,selected=null,dragSpace=false,dragNode=null,last={x:0,y:0},moved=false;
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

function sceneScale(){return Math.min(W/1000,H/720)}
function worldToScreen(x,y,z=1){
  const s=sceneScale(),cw=1000*s,ch=720*s,ox=(W-cw)/2,oy=(H-ch)/2;
  const px=ox+x*s,py=oy+y*s;
  const parX=(mouse.nx-.5)*8*(1-z),parY=(mouse.ny-.5)*6*(1-z);
  return {x:px*view.scale+view.x+(1-view.scale)*W/2+parX,y:py*view.scale+view.y+(1-view.scale)*H/2+parY}
}
function screenToWorld(x,y){
  const s=sceneScale(),cw=1000*s,ch=720*s,ox=(W-cw)/2,oy=(H-ch)/2;
  const px=(x-view.x-(1-view.scale)*W/2)/view.scale;
  const py=(y-view.y-(1-view.scale)*H/2)/view.scale;
  return {x:(px-ox)/s,y:(py-oy)/s}
}
function rebuildBg(){
  bg=[];clouds=[];
  for(let i=0;i<62;i++)bg.push({x:hash(i*3.7)*1000,y:hash(i*8.1)*720,r:.3+hash(i*12.4)*1.15,a:.06+hash(i*15.1)*.30,z:.12+hash(i*17.7)*.55});
  galaxies.forEach((g,gi)=>{
    for(let k=0;k<4;k++){
      const a=hash(gi*50+k*3.1)*Math.PI*2,rr=(42+hash(gi*70+k*5.1)*78);
      clouds.push({g:g.id,x:g.x+Math.cos(a)*rr,y:g.y+Math.sin(a)*rr*.48,rx:95+hash(k*7.1)*65,ry:24+hash(k*9.1)*25,rot:a*.55,alpha:.007+.009*hash(k*11.1)});
    }
  })
}
function resize(){
  W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);rebuildBg()
}
function npos(n){return worldToScreen(n.x,n.y,.92)}
function galaxyOf(n){return G[n.g]}

function drawBackground(t){
  ctx.fillStyle='#02040a';ctx.fillRect(0,0,W,H);
  const v=ctx.createRadialGradient(W*.50,H*.44,0,W*.50,H*.44,Math.max(W,H)*.8);
  v.addColorStop(0,'rgba(10,16,27,.33)');v.addColorStop(.54,'rgba(4,8,15,.08)');v.addColorStop(1,'rgba(0,0,0,.78)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  for(let i=0;i<bg.length;i++){
    const s=bg[i],p=worldToScreen(s.x,s.y,s.z),tw=.76+.24*Math.sin(t/2300+i*.93);
    ctx.beginPath();ctx.arc(p.x,p.y,s.r*(.76+s.z*.32),0,Math.PI*2);ctx.fillStyle=`rgba(224,232,243,${s.a*tw})`;ctx.fill()
  }
}
function drawClouds(){
  for(const n of clouds){
    const g=G[n.g],p=worldToScreen(n.x,n.y,.36),s=sceneScale()*view.scale;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(n.rot);ctx.scale(1,n.ry/n.rx);
    const r=n.rx*s,gr=ctx.createRadialGradient(0,0,0,0,0,r);
    gr.addColorStop(0,rgba(g.color,n.alpha));gr.addColorStop(.42,rgba(g.color,n.alpha*.52));gr.addColorStop(1,rgba(g.color,0));
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.restore()
  }
}
function ray(p,c,len,a,rot){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rot);ctx.strokeStyle=rgba(c,a);ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(len,0);ctx.stroke();ctx.restore()}
function baseCore(n,p,R,c,t){
  const pulse=1+.014*Math.sin(t/1200+n.x*.02);
  const gr=ctx.createRadialGradient(p.x-R*.22,p.y-R*.22,0,p.x,p.y,R*pulse);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.09,'rgba(250,253,255,.99)');gr.addColorStop(.25,rgba(c,.96));gr.addColorStop(.67,rgba(c,.56));gr.addColorStop(1,rgba(c,.055));
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,R*pulse,0,Math.PI*2);ctx.fill()
}
function coreStar(n,p,R,c,t){
  const gl=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*4.6);gl.addColorStop(0,rgba(c,.17));gl.addColorStop(.22,rgba(c,.06));gl.addColorStop(1,rgba(c,0));ctx.fillStyle=gl;ctx.beginPath();ctx.arc(p.x,p.y,R*4.6,0,Math.PI*2);ctx.fill();
  ray(p,c,R*3.8,.16,.05);ray(p,c,R*2.05,.09,Math.PI/2+.05);baseCore(n,p,R,c,t)
}
function formingStar(n,p,R,c,t){
  const gl=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*4.0);gl.addColorStop(0,rgba(c,.13));gl.addColorStop(.25,rgba(c,.042));gl.addColorStop(1,rgba(c,0));ctx.fillStyle=gl;ctx.beginPath();ctx.arc(p.x,p.y,R*4,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t/25000+n.x*.006);for(let k=0;k<2;k++){ctx.beginPath();ctx.ellipse(0,0,R*(1.55+k*.55),R*(.38+k*.13),.45+k*.4,0,Math.PI*2);ctx.strokeStyle=rgba(c,.068-k*.018);ctx.lineWidth=.52;ctx.stroke()}ctx.restore();baseCore(n,p,R,c,t)
}
function veiledStar(n,p,R,c,t){
  const gl=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*4.8);gl.addColorStop(0,rgba(c,.115));gl.addColorStop(.24,rgba(c,.042));gl.addColorStop(.60,rgba(c,.012));gl.addColorStop(1,rgba(c,0));ctx.fillStyle=gl;ctx.beginPath();ctx.arc(p.x,p.y,R*4.8,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t/31000+n.y*.005);for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(0,0,R*(1.42+k*.46),R*(.29+k*.11),.35+k*.65,0,Math.PI*2);ctx.strokeStyle=rgba(c,.042-k*.007);ctx.lineWidth=.5;ctx.stroke()}ctx.restore();baseCore(n,p,R*.88,c,t)
}
function bridgeStar(n,p,R,c,t){const gl=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*4.0);gl.addColorStop(0,rgba(c,.15));gl.addColorStop(.24,rgba(c,.047));gl.addColorStop(1,rgba(c,0));ctx.fillStyle=gl;ctx.beginPath();ctx.arc(p.x,p.y,R*4,0,Math.PI*2);ctx.fill();ray(p,c,R*3,.13,-.22);baseCore(n,p,R,c,t)}
function traceStar(n,p,R,c,t){const gl=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*2.7);gl.addColorStop(0,rgba(c,.085));gl.addColorStop(1,rgba(c,0));ctx.fillStyle=gl;ctx.beginPath();ctx.arc(p.x,p.y,R*2.7,0,Math.PI*2);ctx.fill();baseCore(n,p,R*.65,c,t)}
function drawStar(n,t){
  const p=npos(n),R=(3.2+n.size*.37)*view.scale,c=hex(n.color);
  ({core:coreStar,forming:formingStar,veiled:veiledStar,bridge:bridgeStar,trace:traceStar}[n.type]||traceStar)(n,p,R,c,t);
  if((hover&&hover.id===n.id)||(selected&&selected.id===n.id)||dragNode===n){ctx.beginPath();ctx.arc(p.x,p.y,R+6,0,Math.PI*2);ctx.strokeStyle=rgba(c,.40);ctx.lineWidth=.7;ctx.stroke()}
}
function drawRelations(){
  const focus=dragNode||hover||selected;if(!focus)return;
  for(const l of links){
    const A=typeof l.source==='string'?nodes.find(n=>n.id===l.source):l.source;
    const B=typeof l.target==='string'?nodes.find(n=>n.id===l.target):l.target;
    if(A.id!==focus.id&&B.id!==focus.id)continue;
    const pa=npos(A),pb=npos(B),gr=ctx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);
    gr.addColorStop(0,'rgba(228,237,249,.27)');gr.addColorStop(1,'rgba(228,237,249,.05)');ctx.strokeStyle=gr;ctx.lineWidth=l.cross?.55:.7;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke()
  }
}
function drawGalaxyLabel(){
  const focus=dragNode||hover||selected;if(!focus)return;
  const g=galaxyOf(focus),p=worldToScreen(g.x,g.y-115,.55);ctx.save();ctx.textAlign='center';ctx.font=`500 ${Math.max(10,11*view.scale)}px Inter,"PingFang SC",sans-serif`;ctx.fillStyle='rgba(216,226,239,.42)';ctx.fillText(g.name,p.x,p.y);ctx.restore()
}
function pick(x,y){let best=null,bd=1e9;for(const n of nodes){const p=npos(n),r=(8+n.size*.43)*view.scale+8,d=Math.hypot(x-p.x,y-p.y);if(d<r&&d<bd){best=n;bd=d}}return best}
function setTip(n,x,y){if(!n){tooltip.classList.remove('show');return}tooltip.querySelector('strong').textContent=n.name;tooltip.querySelector('small').textContent=n.state;tooltip.style.left=x+'px';tooltip.style.top=y+'px';tooltip.classList.add('show')}
function selectNode(n){selected=n||null;if(!n){card.classList.remove('show');return}const g=galaxyOf(n);galaxy.textContent=g.name;title.textContent=n.name;en.textContent=n.en;state.textContent=n.state;summary.textContent=n.summary;known.textContent=n.known;unknown.textContent=n.unknown;explain.classList.remove('show');toggle.textContent='查看这颗星为什么是这样';card.classList.add('show')}
function frame(t){ctx.clearRect(0,0,W,H);drawBackground(t);drawClouds();drawRelations();drawGalaxyLabel();for(const n of nodes)drawStar(n,t);requestAnimationFrame(frame)}

canvas.addEventListener('mousemove',e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;mouse.nx=e.clientX/W;mouse.ny=e.clientY/H;
  if(dragNode){const p=screenToWorld(e.clientX,e.clientY);dragNode.fx=p.x;dragNode.fy=p.y;moved=true;setTip(dragNode,e.clientX,e.clientY);return}
  if(dragSpace){const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;view.x+=dx;view.y+=dy;last={x:e.clientX,y:e.clientY};return}
  hover=pick(e.clientX,e.clientY);setTip(hover,e.clientX,e.clientY);canvas.style.cursor=hover?'pointer':'grab';hint.style.opacity=.16
});
canvas.addEventListener('mouseleave',()=>{if(!dragNode){hover=null;setTip(null)}});
canvas.addEventListener('mousedown',e=>{
  const n=pick(e.clientX,e.clientY);moved=false;last={x:e.clientX,y:e.clientY};
  if(n){dragNode=n;n.fx=n.x;n.fy=n.y;simulation.alphaTarget(.20).restart();canvas.classList.add('dragging')}
  else{dragSpace=true;canvas.classList.add('dragging')}
});
addEventListener('mouseup',()=>{if(dragNode){dragNode.fx=null;dragNode.fy=null;simulation.alpha(Math.max(simulation.alpha(),.16)).alphaTarget(0).restart()}dragNode=null;dragSpace=false;canvas.classList.remove('dragging')});
canvas.addEventListener('click',e=>{if(moved)return;selectNode(pick(e.clientX,e.clientY))});
canvas.addEventListener('wheel',e=>{e.preventDefault();view.scale=Math.max(.72,Math.min(2.3,view.scale*(e.deltaY<0?1.09:.92)))},{passive:false});
close.onclick=()=>selectNode(null);
toggle.onclick=()=>{const on=explain.classList.toggle('show');toggle.textContent=on?'收起':'查看这颗星为什么是这样'};
addEventListener('resize',resize);resize();requestAnimationFrame(frame);
</script>
</body>
