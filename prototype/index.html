<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Knowledge Constellation</title>
<style>
:root{color-scheme:dark;--bg:#03050a;--fg:#eef4fb;--muted:#7b8798;--glass:rgba(8,12,19,.74);--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--fg)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas.dragging{cursor:grabbing}
.identity{position:fixed;z-index:5;left:26px;top:22px;pointer-events:none;user-select:none}
.identity b{display:block;font-size:12px;font-weight:560;letter-spacing:.13em;color:rgba(235,242,250,.68)}
.identity span{display:block;margin-top:5px;font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:rgba(165,176,192,.28)}
.hint{position:fixed;z-index:4;left:27px;bottom:21px;font-size:9px;letter-spacing:.05em;color:rgba(154,165,181,.28);pointer-events:none;transition:opacity .35s}
.tooltip{position:fixed;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,-125%);transition:opacity .12s ease;padding:7px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.07);background:rgba(7,11,17,.82);backdrop-filter:blur(12px);box-shadow:0 14px 45px rgba(0,0,0,.3)}
.tooltip.show{opacity:1}.tooltip strong{font-size:11px;font-weight:570}.tooltip small{display:block;margin-top:3px;font-size:9px;color:#7a8698}
.card{position:fixed;z-index:9;right:22px;top:22px;width:min(330px,calc(100vw - 44px));padding:19px 19px 17px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(12,17,26,.84),rgba(7,11,17,.88));box-shadow:0 24px 80px rgba(0,0,0,.35);backdrop-filter:blur(24px);opacity:0;transform:translateY(-8px) scale(.985);pointer-events:none;transition:.2s ease}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .close{position:absolute;right:13px;top:10px;border:0;background:transparent;color:#647082;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px}
.card .close:hover{background:rgba(255,255,255,.05);color:#dfe7f0}
.card .galaxy{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#697587}
.card h2{margin:9px 0 3px;font-size:20px;font-weight:580}
.card .en{font-size:10px;color:#6f7a8b}
.card .state{display:inline-flex;margin-top:13px;border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:5px 8px;font-size:10px;color:#9aa6b6;background:rgba(255,255,255,.025)}
.card p{font-size:12px;line-height:1.8;color:#bcc6d3}
.card .explain{display:none;margin-top:15px;padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}
.card .explain.show{display:block}
.card h3{margin:0 0 7px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6d798c}
.card .explain p{font-size:11px;color:#8894a5;margin:0 0 11px}
.card .toggle{border:0;background:transparent;color:#788496;font-size:10px;padding:0;margin-top:5px;cursor:pointer}
.card .toggle:hover{color:#c9d2de}
@media(max-width:720px){.identity{left:17px;top:16px}.hint{left:18px;bottom:15px}.card{left:13px;right:13px;top:auto;bottom:13px;width:auto}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="identity"><b>KNOWLEDGE CONSTELLATION</b><span>qibai</span></div>
<div class="hint" id="hint">移动 · 滚轮缩放 · 点击星体</div>
<div class="tooltip" id="tooltip"><strong></strong><small></small></div>
<aside class="card" id="card">
<button class="close" id="close">×</button>
<div class="galaxy" id="galaxy"></div>
<h2 id="title"></h2><div class="en" id="en"></div><div class="state" id="state"></div>
<p id="summary"></p>
<button class="toggle" id="toggle">查看这颗星为什么是这样</button>
<div class="explain" id="explain">
<h3>现在能确认</h3><p id="known"></p>
<h3>仍然模糊</h3><p id="unknown"></p>
</div>
</aside>
<script>
const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');
const tooltip=document.getElementById('tooltip'),card=document.getElementById('card');
const DPR=Math.min(window.devicePixelRatio||1,2);

const galaxies=[
{id:'oss',name:'开源参与与工程流转',cx:.255,cy:.38,spread:.205,color:[108,146,202]},
{id:'desktop',name:'课刻与桌面产品',cx:.735,cy:.37,spread:.215,color:[156,119,179]},
{id:'web',name:'Web 基础补全',cx:.49,cy:.765,spread:.20,color:[91,151,142]}
];

const nodes=[
{id:'oss-p',g:'oss',x:.205,y:.325,size:18,type:'core',name:'开源参与',en:'Open-source Participation',state:'清晰',res:.95,color:'#dfeeff',summary:'持续进入真实开源项目并完成贡献流程，已经形成稳定痕迹。',known:'持续参与、外部接受与维护者反馈都能被确认。',unknown:'不同 PR 中具体由本人完成了多少分析、实现和测试，仍需额外信息。'},
{id:'pr',g:'oss',x:.315,y:.415,size:13,type:'bridge',name:'GitHub / PR',en:'GitHub / Pull Request Workflow',state:'清晰',res:.92,color:'#c7ddfa',summary:'PR、CI、Review、修改与合并反复出现在实践中。',known:'完整 PR 流程是真实且重复出现的。',unknown:'复杂 Git 操作和独立处理能力还没有被充分证明。'},
{id:'test',g:'oss',x:.145,y:.465,size:11,type:'forming',name:'测试与验证',en:'Testing & Validation',state:'正在形成',res:.63,color:'#a8c8ef',summary:'测试、回归、CI 与真实环境验证持续围绕项目与贡献出现。',known:'它明确属于当前工程经历的一部分。',unknown:'测试方案是否主要由本人设计、能否独立判断覆盖与正确性，还没有看清。'},
{id:'conc',g:'oss',x:.36,y:.295,size:6,type:'trace',name:'并发',en:'Concurrency',state:'外围痕迹',res:.26,color:'#829dbf',summary:'并发、CAS 等概念进入过真实贡献场景。',known:'这些概念确实出现过。',unknown:'不能据此判断本人掌握并发机制。'},
{id:'sqlite',g:'oss',x:.405,y:.33,size:5,type:'trace',name:'SQLite / WAL',en:'SQLite / WAL',state:'外围痕迹',res:.22,color:'#738aa9',summary:'SQLite / WAL 曾进入真实贡献场景。',known:'存在真实上下文关联。',unknown:'个人理解与独立实践深度未知。'},

{id:'product',g:'desktop',x:.665,y:.315,size:19,type:'core',name:'产品迭代',en:'Product Iteration',state:'正在形成',res:.67,color:'#eadff4',summary:'长期维护的个人产品形成了一条持续迭代轨迹。',known:'功能演进、限制、测试和发布等持续推进是真实存在的。',unknown:'具体实现、设计与判断分别由谁完成，仍没有完全解析。'},
{id:'tauri',g:'desktop',x:.845,y:.305,size:11,type:'veiled',name:'Tauri',en:'Tauri',state:'高关联 · 低解析',res:.31,color:'#cbb4d9',summary:'Tauri 是核心项目长期存在的技术环境。',known:'它与长期项目稳定关联。',unknown:'独立使用 Tauri 的能力深度尚未确认。'},
{id:'rust',g:'desktop',x:.655,y:.475,size:14,type:'veiled',name:'Rust',en:'Rust',state:'高关联 · 低解析',res:.27,color:'#d7bbdf',summary:'Rust 在项目技术环境与部分贡献场景中反复出现。',known:'Rust 确实属于当前经历。',unknown:'项目中存在 Rust，不等于能独立实现、调试或解释 Rust。'},
{id:'ts',g:'desktop',x:.825,y:.455,size:11,type:'veiled',name:'TypeScript',en:'TypeScript',state:'高关联 · 低解析',res:.30,color:'#c3a9cf',summary:'TypeScript 高频存在于项目环境中。',known:'它是长期项目中的真实技术环境。',unknown:'独立实现与理解深度尚未确认。'},

{id:'webn',g:'web',x:.405,y:.745,size:17,type:'forming',name:'Web / 网络基础',en:'Web / Network Fundamentals',state:'正在形成',res:.70,color:'#d7eee9',summary:'Web、HTTP、网络和安全基础形成了一条持续学习主线。',known:'存在结构化学习与纠错痕迹。',unknown:'长期记忆和迁移能力还没有通过新的行为证据确认。'},
{id:'browser',g:'web',x:.565,y:.705,size:14,type:'forming',name:'浏览器渲染',en:'Browser Rendering',state:'正在形成',res:.66,color:'#b8ddd6',summary:'浏览器渲染主干已经形成连续学习轨迹。',known:'DOM、CSSOM、Layout、Paint、Composite 等都有真实学习记录。',unknown:'脱离提示后的稳定解释能力仍需后续观察。'},
{id:'js',g:'web',x:.515,y:.85,size:15,type:'forming',name:'JavaScript / DOM',en:'JavaScript / DOM',state:'正在形成',res:.72,color:'#c6e4de',summary:'JavaScript 与 DOM 明确处在当前学习主线。',known:'“正在学习”本身是高置信事实。',unknown:'目前不能把它表示成成熟能力。'}
];

const relations=[
['oss-p','pr'],['oss-p','test'],['pr','test'],['pr','conc'],['conc','sqlite'],
['product','tauri'],['product','rust'],['product','ts'],['tauri','rust'],
['webn','browser'],['browser','js'],['test','product']
];

let W=0,H=0,view={x:0,y:0,scale:1},mouse={x:0,y:0,nx:0,ny:0},hover=null,selected=null;
let drag=false,last={x:0,y:0},moved=false;
let bgStars=[],dust=[],nebula=[];
const hash=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453123;return x-Math.floor(x)};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;

function rebuild(){
  bgStars=[];dust=[];nebula=[];
  for(let i=0;i<470;i++)bgStars.push({x:hash(i*2.3),y:hash(i*5.7),z:.15+hash(i*9.1)*.85,r:.25+hash(i*11.3)*1.25,a:.05+hash(i*17.9)*.42});
  galaxies.forEach((g,gi)=>{
    for(let i=0;i<100;i++){
      const a=hash(gi*1000+i*3.1)*Math.PI*2;
      const rr=Math.pow(hash(gi*2000+i*7.3),.72)*g.spread;
      dust.push({g:g.id,x:g.cx+Math.cos(a)*rr,y:g.cy+Math.sin(a)*rr*(.42+.22*hash(i*9.7)),z:.35+hash(i*12.1)*.45,r:.25+hash(i*15.7)*1.05,a:.025+hash(i*18.4)*.11});
    }
    for(let k=0;k<9;k++){
      const a=hash(gi*40+k*2.1)*Math.PI*2,rr=hash(gi*80+k*4.3)*g.spread*.58;
      nebula.push({g:g.id,x:g.cx+Math.cos(a)*rr,y:g.cy+Math.sin(a)*rr*.55,rx:g.spread*(.34+.30*hash(k*3.4)),ry:g.spread*(.10+.12*hash(k*5.4)),rot:a*.65,alpha:.015+.022*hash(k*8.1)});
    }
  });
}
function resize(){
  W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);rebuild();
}
function base(){return Math.min(W,H*1.18)}
function world(x,y,z=1){
  const B=base(),ox=(W-B)/2,oy=(H-B*.82)/2;
  const px=(ox+x*B),py=(oy+y*B*.82);
  const parX=(mouse.nx-.5)*16*(1-z),parY=(mouse.ny-.5)*11*(1-z);
  return {x:(px*view.scale+view.x+(1-view.scale)*W/2)+parX,y:(py*view.scale+view.y+(1-view.scale)*H/2)+parY};
}
function drawBackground(t){
  ctx.fillStyle='#03050a';ctx.fillRect(0,0,W,H);
  const v=ctx.createRadialGradient(W*.49,H*.45,0,W*.49,H*.45,Math.max(W,H)*.78);
  v.addColorStop(0,'rgba(11,17,27,.36)');v.addColorStop(.55,'rgba(6,9,15,.10)');v.addColorStop(1,'rgba(0,0,0,.72)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);

  bgStars.forEach((s,i)=>{
    const p=world(s.x,s.y,s.z),tw=.72+.28*Math.sin(t/1600+i*.73);
    ctx.beginPath();ctx.arc(p.x,p.y,s.r*(.65+s.z*.55),0,Math.PI*2);
    ctx.fillStyle=`rgba(210,222,238,${s.a*tw*(.45+s.z*.75)})`;ctx.fill();
  })
}
function drawNebula(){
  galaxies.forEach(g=>{
    const c=g.color;
    nebula.filter(n=>n.g===g.id).forEach(n=>{
      const p=world(n.x,n.y,.42),B=base()*view.scale;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(n.rot);
      const rx=n.rx*B,ry=n.ry*B;
      const gr=ctx.createRadialGradient(0,0,0,0,0,rx);
      gr.addColorStop(0,rgba(c,n.alpha*1.6));gr.addColorStop(.38,rgba(c,n.alpha));gr.addColorStop(1,rgba(c,0));
      ctx.scale(1,Math.max(.12,ry/rx));ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,rx,0,Math.PI*2);ctx.fill();ctx.restore();
    });
  });
  dust.forEach(d=>{
    const g=galaxies.find(x=>x.id===d.g),p=world(d.x,d.y,d.z),c=g.color;
    ctx.beginPath();ctx.arc(p.x,p.y,d.r,0,Math.PI*2);ctx.fillStyle=rgba(c,d.a);ctx.fill();
  })
}
function starPos(n){return world(n.x,n.y,.9)}
function drawRay(p,c,len,alpha,rot=0){
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(rot);ctx.strokeStyle=rgba(c,alpha);ctx.lineWidth=.55;
  ctx.beginPath();ctx.moveTo(-len,0);ctx.lineTo(len,0);ctx.stroke();ctx.restore();
}
function drawCore(n,p,R,c,t){
  const pulse=1+.025*Math.sin(t/1000+n.x*13);
  const gr=ctx.createRadialGradient(p.x-R*.26,p.y-R*.26,0,p.x,p.y,R*pulse);
  gr.addColorStop(0,'rgba(255,255,255,.99)');gr.addColorStop(.12,rgba(c,.98));gr.addColorStop(.55,rgba(c,.74));gr.addColorStop(1,rgba(c,.12));
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(p.x,p.y,R*pulse,0,Math.PI*2);ctx.fill();
}
function drawCoreStar(n,p,R,c,t){
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*5.8);g.addColorStop(0,rgba(c,.26));g.addColorStop(.22,rgba(c,.09));g.addColorStop(1,rgba(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R*5.8,0,Math.PI*2);ctx.fill();
  drawRay(p,c,R*4.2,.20,.08);drawRay(p,c,R*2.7,.14,Math.PI/2+.08);drawCore(n,p,R,c,t);
  ctx.beginPath();ctx.arc(p.x,p.y,R+5,0,Math.PI*2);ctx.strokeStyle=rgba(c,.18);ctx.lineWidth=.7;ctx.stroke();
}
function drawForming(n,p,R,c,t){
  const pulse=.5+.5*Math.sin(t/1350+n.y*9);
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*4.8);g.addColorStop(0,rgba(c,.19));g.addColorStop(.25,rgba(c,.07));g.addColorStop(1,rgba(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R*4.8,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t/18000+n.x);
  for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(0,0,R*(1.7+k*.5),R*(.65+k*.18),k*.72,0,Math.PI*2);ctx.strokeStyle=rgba(c,.06+.035*pulse);ctx.lineWidth=.65;ctx.stroke()}
  ctx.restore();drawCore(n,p,R,c,t);
}
function drawVeiled(n,p,R,c,t){
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*6.2);g.addColorStop(0,rgba(c,.16));g.addColorStop(.20,rgba(c,.07));g.addColorStop(.55,rgba(c,.025));g.addColorStop(1,rgba(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R*6.2,0,Math.PI*2);ctx.fill();
  ctx.save();ctx.translate(p.x,p.y);ctx.globalAlpha=.7;
  for(let k=0;k<5;k++){
    const a=k*1.27+t/16000,rr=R*(1.0+k*.26);
    ctx.beginPath();ctx.ellipse(Math.cos(a)*rr*.28,Math.sin(a)*rr*.18,R*(.9+k*.15),R*(.45+k*.08),a*.35,0,Math.PI*2);
    ctx.fillStyle=rgba(c,.035);ctx.fill();
  }
  ctx.restore();drawCore(n,p,R*.92,c,t);
  ctx.beginPath();ctx.arc(p.x,p.y,R+4,0,Math.PI*2);ctx.setLineDash([2,4]);ctx.strokeStyle=rgba(c,.18);ctx.lineWidth=.6;ctx.stroke();ctx.setLineDash([]);
}
function drawBridge(n,p,R,c,t){
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*4.5);g.addColorStop(0,rgba(c,.21));g.addColorStop(.22,rgba(c,.08));g.addColorStop(1,rgba(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R*4.5,0,Math.PI*2);ctx.fill();
  drawRay(p,c,R*3.1,.16,-.25);drawCore(n,p,R,c,t);
  ctx.beginPath();ctx.arc(p.x,p.y,R+4.5,0,Math.PI*2);ctx.strokeStyle=rgba(c,.24);ctx.lineWidth=.7;ctx.stroke();
}
function drawTrace(n,p,R,c,t){
  const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*3.5);g.addColorStop(0,rgba(c,.11));g.addColorStop(1,rgba(c,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,R*3.5,0,Math.PI*2);ctx.fill();
  drawCore(n,p,R*.72,c,t);
}
function drawStar(n,t){
  const p=starPos(n),R=(3.6+n.size*.39)*view.scale,c=hex(n.color);
  ({core:drawCoreStar,forming:drawForming,veiled:drawVeiled,bridge:drawBridge,trace:drawTrace}[n.type]||drawTrace)(n,p,R,c,t);
  const active=(hover&&hover.id===n.id)||(selected&&selected.id===n.id);
  if(active){ctx.beginPath();ctx.arc(p.x,p.y,R+7,0,Math.PI*2);ctx.strokeStyle=rgba(c,.46);ctx.lineWidth=.8;ctx.stroke()}
}
function drawRelations(){
  if(!hover&&!selected)return;
  const focus=(hover||selected).id;
  relations.forEach(([a,b])=>{
    if(a!==focus&&b!==focus)return;
    const A=nodes.find(n=>n.id===a),B=nodes.find(n=>n.id===b),pa=starPos(A),pb=starPos(B);
    const gr=ctx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);gr.addColorStop(0,'rgba(225,235,248,.24)');gr.addColorStop(1,'rgba(225,235,248,.055)');
    ctx.strokeStyle=gr;ctx.lineWidth=.65;ctx.beginPath();ctx.moveTo(pa.x,pa.y);ctx.lineTo(pb.x,pb.y);ctx.stroke();
  })
}
function drawGalaxyNames(){
  galaxies.forEach(g=>{
    const near=(hover&&hover.g===g.id)||(selected&&selected.g===g.id); if(!near)return;
    const p=world(g.cx,g.cy-g.spread*.56,.55);
    ctx.save();ctx.textAlign='center';ctx.font=`500 ${Math.max(10,11*view.scale)}px Inter,"PingFang SC",sans-serif`;ctx.fillStyle='rgba(214,224,237,.44)';ctx.fillText(g.name,p.x,p.y);ctx.restore();
  })
}
function loop(t){
  ctx.clearRect(0,0,W,H);drawBackground(t);drawNebula();drawRelations();drawGalaxyNames();nodes.forEach(n=>drawStar(n,t));requestAnimationFrame(loop)
}
function pick(x,y){
  let best=null,bd=1e9;
  nodes.forEach(n=>{const p=starPos(n),r=(8+n.size*.45)*view.scale+8,d=Math.hypot(x-p.x,y-p.y);if(d<r&&d<bd){best=n;bd=d}});
  return best;
}
function setTooltip(n,x,y){
  if(!n){tooltip.classList.remove('show');return}
  tooltip.querySelector('strong').textContent=n.name;tooltip.querySelector('small').textContent=n.state;
  tooltip.style.left=x+'px';tooltip.style.top=y+'px';tooltip.classList.add('show');
}
function selectNode(n){
  selected=n||null;if(!n){card.classList.remove('show');return}
  const g=galaxies.find(x=>x.id===n.g);
  galaxy.textContent=g.name;title.textContent=n.name;en.textContent=n.en;state.textContent=n.state;
  summary.textContent=n.summary;known.textContent=n.known;unknown.textContent=n.unknown;
  explain.classList.remove('show');toggle.textContent='查看这颗星为什么是这样';card.classList.add('show');
}
canvas.addEventListener('mousemove',e=>{
  mouse.x=e.clientX;mouse.y=e.clientY;mouse.nx=e.clientX/W;mouse.ny=e.clientY/H;
  if(drag){const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;view.x+=dx;view.y+=dy;last={x:e.clientX,y:e.clientY};return}
  hover=pick(e.clientX,e.clientY);setTooltip(hover,e.clientX,e.clientY);canvas.style.cursor=hover?'pointer':'grab';hint.style.opacity=.18;
});
canvas.addEventListener('mouseleave',()=>{hover=null;setTooltip(null)});
canvas.addEventListener('mousedown',e=>{if(pick(e.clientX,e.clientY))return;drag=true;moved=false;last={x:e.clientX,y:e.clientY};canvas.classList.add('dragging')});
addEventListener('mouseup',()=>{drag=false;canvas.classList.remove('dragging')});
canvas.addEventListener('click',e=>{if(moved)return;selectNode(pick(e.clientX,e.clientY))});
canvas.addEventListener('wheel',e=>{e.preventDefault();view.scale=Math.max(.72,Math.min(2.25,view.scale*(e.deltaY<0?1.09:.92)))},{passive:false});
close.onclick=()=>selectNode(null);
toggle.onclick=()=>{const on=explain.classList.toggle('show');toggle.textContent=on?'收起':'查看这颗星为什么是这样'};
addEventListener('resize',resize);resize();requestAnimationFrame(loop);
</script>
</body>
</html>
