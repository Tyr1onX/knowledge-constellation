      <stop offset="0.42" stop-color="#a9c9ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#74a5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

