<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Constellation visual preview</title>
  <desc id="desc">A dark personal knowledge universe built from the Tyr1onX sample, with a central identity core and three surrounding knowledge galaxies.</desc>
  <defs>
