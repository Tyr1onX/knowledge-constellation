      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="0.62" stop-color="#030405"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.12" stop-color="#f7f8ff" stop-opacity="0.98"/>
      <stop offset="0.42" stop-color="#cfd6ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7f8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmStar" cx="50%" cy="50%" r="50%">
