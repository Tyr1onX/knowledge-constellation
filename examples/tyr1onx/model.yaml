unresolved:
  - id: independent-implementation-depth
    reason: Public artifacts do not reveal how independently code was produced.

  - id: ai-assistance-level
    reason: Public GitHub evidence alone does not reliably reveal AI contribution to implementation.

  - id: durable-retention
    reason: Learning records do not independently verify later recall or transfer.

  - id: framework-depth
    reason: Technologies in repositories should not be promoted to capability without stronger evidence.

candidate_calibration_targets:
  - target: testing-validation
    why: Clarifying the subject's role in designing tests could materially change a central engineering node.

  - target: rust-typescript-tauri
    why: A single low-cost attribution question could resolve several high-exposure but low-confidence nodes.

  - target: web-network-fundamentals
    why: A few fresh explanation questions could distinguish retained understanding from stale learning records.
